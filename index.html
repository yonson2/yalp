<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Recorder</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%233b5bdb'/%3E%3Cg fill='%23fff'%3E%3Crect x='6' y='11' width='2.6' height='6' rx='1.3'/%3E%3Crect x='10.5' y='8' width='2.6' height='12' rx='1.3'/%3E%3Crect x='15' y='11.5' width='2.6' height='5' rx='1.3'/%3E%3Crect x='19.5' y='9.5' width='2.6' height='9' rx='1.3'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <svg class="logo" viewBox="0 0 28 28" aria-hidden="true">
          <rect width="28" height="28" rx="7" fill="#3b5bdb" />
          <g fill="#fff">
            <rect x="6" y="11" width="2.6" height="6" rx="1.3" />
            <rect x="10.5" y="8" width="2.6" height="12" rx="1.3" />
            <rect x="15" y="11.5" width="2.6" height="5" rx="1.3" />
            <rect x="19.5" y="9.5" width="2.6" height="9" rx="1.3" />
          </g>
        </svg>
        <h1>Voice Recorder</h1>
      </div>
      <div class="status" role="status">
        <span id="statusDot" class="dot dot-green"></span>
        <span id="statusText">Ready to record</span>
      </div>
    </header>

    <main>
      <section class="card recorder-card" aria-label="Recorder">
        <div id="bigTimer" class="big-timer">00:00:00</div>
        <p id="subtitle" class="subtitle">Ready to record</p>
        <div class="tile-row">
          <button id="recordTile" class="tile tile-record" type="button">
            <svg viewBox="0 0 48 48" class="tile-icon" aria-hidden="true">
              <circle cx="24" cy="24" r="17" fill="#fbd9d4" />
              <circle cx="24" cy="24" r="11" fill="#ef4538" />
            </svg>
            <span>Record</span>
          </button>
          <button id="stopTile" class="tile tile-stop" type="button" disabled>
            <svg viewBox="0 0 48 48" class="tile-icon" aria-hidden="true">
              <rect x="14" y="14" width="20" height="20" rx="4" fill="#1f2937" />
            </svg>
            <span>Stop</span>
          </button>
        </div>
      </section>

      <section class="card waveform-card" aria-label="Live audio">
        <div class="card-head">
          <h2>Live audio</h2>
          <span class="wave-status">
            <span id="waveDot" class="dot dot-blue"></span>
            <span id="waveStatusText">Idle</span>
          </span>
        </div>
        <canvas id="waveCanvas" aria-hidden="true"></canvas>
      </section>

      <section class="card transport-card" aria-label="Playback">
        <div class="transport-buttons">
          <button id="transportRecord" class="btn btn-record" type="button">
            <svg viewBox="0 0 16 16" class="btn-icon" aria-hidden="true">
              <circle cx="8" cy="8" r="5.5" fill="currentColor" />
            </svg>
            <span class="btn-label">Record</span>
          </button>
          <button id="playBtn" class="btn" type="button" data-label="Play" disabled>
            <svg viewBox="0 0 16 16" class="btn-icon icon-play" aria-hidden="true">
              <path d="M4.5 2.8v10.4L13 8z" fill="currentColor" />
            </svg>
            <svg viewBox="0 0 16 16" class="btn-icon icon-stop hidden" aria-hidden="true">
              <rect x="3.5" y="3.5" width="9" height="9" rx="1.5" fill="currentColor" />
            </svg>
            <span class="btn-label">Play</span>
          </button>
          <button id="playRevBtn" class="btn" type="button" data-label="Play reversed" disabled>
            <svg viewBox="0 0 20 16" class="btn-icon icon-play" aria-hidden="true">
              <path d="M9.5 2.8v10.4L2 8z" fill="currentColor" />
              <path d="M18 2.8v10.4L10.5 8z" fill="currentColor" />
            </svg>
            <svg viewBox="0 0 16 16" class="btn-icon icon-stop hidden" aria-hidden="true">
              <rect x="3.5" y="3.5" width="9" height="9" rx="1.5" fill="currentColor" />
            </svg>
            <span class="btn-label">Play reversed</span>
          </button>
        </div>
        <div class="scrub-row">
          <span id="timeLabel" class="time-label">00:00 / 00:00</span>
          <input id="seekSlider" type="range" min="0" max="0" step="0.01" value="0" disabled aria-label="Seek" />
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
